local_patch = "Windows D3D11 scoped access, device epoch, leased premultiplied surfaces, bounded frame capture and explicit reconstruction diagnostics; cached views retain their own entity dependency even when accessed earlier in the frame; native window-control hitboxes retained across cached paint replay, hit tested at the platform message position in front-to-back order with allocation-free control filtering and occlusion checks, and explicit client areas inside captions; stable cached monochrome glyphs with GPU translation; explicit SVG coverage compositing with shared raster cache and unchanged default contrast correction; Windows monochrome sprite sampling clamped per fragment to tile texel centers to isolate neighboring atlas content without changing UV mapping or cache identity; borrowed tessellated paths with fused translation and DPI scaling for live charts; exported line caps and joins and 32-bit stroke tessellation indices for dense round chart strokes; reusable open-polyline stroke tessellator with borrowed path events and retained Path vertex capacity; Taffy 0.9.2 with grid 1.0.1 locked for GHSA-38c5-483c-4qqp"
import_whitespace_normalization = "Seven space-before-tab indentation lines in the upstream Metal shader"
